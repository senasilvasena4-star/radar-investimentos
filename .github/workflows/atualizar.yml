name: Atualizar cotações

on:
  schedule:
    - cron: '*/30 * * * *'   # a cada 30 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # permite rodar na hora pelo site do GitHub

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar cotações, analisar e verificar alerta
        run: node scripts/update.mjs
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      - name: Salvar dados
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json data/state.json
          git diff --staged --quiet || (git commit -m "Atualiza cotações" && git pull --rebase && git push)
